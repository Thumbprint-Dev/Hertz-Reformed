<!--
  Checkout · step 1, order details.

  Rewritten off Bootstrap. Every binding is the stock one — `cart_order` is still the form
  name `orderSummary.html` and `checkOutViewCtrl` read for validity, `currentOrder.*` model
  paths are unchanged, and the `octextfield` directives and their `ng-required` expressions
  are byte-for-byte what they were. What changed is the chrome: `panel-*`, `col-xs-*`,
  `input-group`, `form-control` and the inline `<style>` block are gone, replaced by the
  `hz-co-*` components in custom.css.

  That matters because the old markup could only be restyled from the outside, with a pile
  of `!important` fighting Bootstrap's own rules. Two stylesheets arguing over the same
  element is why this page kept looking half-finished whatever was done to it.

  Branches nobody at Hertz currently reaches — the PO ID field, cost centres, free-form
  cost centre — are kept, not deleted. They are permission-gated Four51 behaviour and a
  different tenant or a permission change brings them back; removing them would be removing
  functionality, which is not what restyling means.
-->
<!--
  Shown only when there is something in it to fill in.

  For an ordinary Hertz shopper there is nothing: no Order ID (that needs `EditPOID`), no
  cost centre, and no Champion panel. The section still rendered, so checkout opened on a
  heading called "Order" with no fields under it, above the step that actually matters.

  `ng-show`, not `ng-if`: `cart_order` is one of the three forms `orderSummary.html` reads
  to enable Submit, and a form removed from the DOM evaluates to `undefined` there. Hidden,
  it stays registered and valid.

  The condition mirrors the inner ones exactly — change a field's condition and change this
  with it, or the section reappears empty.
-->
<div class="hz-co-card"
     ng-show="user.Permissions.contains('EditPOID')
           || (user.Permissions.contains('CostCenterPerOrder') && !user.Permissions.contains('CostCenterPerLine') && user.CostCenters.length > 0)
           || (user.Permissions.contains('CostCenterPerOrder') && user.Permissions.contains('FreeFormCostCenter'))
           || hertzChampionUser || dollarChampionUser || thriftyChampionUser">
  <!-- Headed like Shipping below it. No status icon: the summary says in words what is
       still needed before Submit. -->
  <div class="hz-co-card-h">
    <h3 class="hz-co-card-t">Order details</h3>
  </div>

  <div class="hz-co-card-b">
    <form name="cart_order" novalidate="">

      <div class="hz-co-field" ng-if="user.Permissions.contains('EditPOID')">
        <label class="hz-co-label is-required" for="hz-co-orderid">
          {{('Order' | r) + ' ' + ('ID' | r) | xlat}}
        </label>
        <div class="hz-co-inline">
          <input id="hz-co-orderid" class="hz-co-input" name="orderid" type="text"
                 ng-disabled="currentOrder.autoID"
                 ng-model="currentOrder.ExternalID"
                 required
                 ui-mask="{{currentOrder.autoID ? null : user.Company.POIDMask}}" />
          <label class="hz-co-check" ng-if="user.Permissions.contains('AllowAutoGenPOID')">
            <input type="checkbox"
                   ng-click="currentOrder.ExternalID = currentOrder.autoID ? null : 'auto'"
                   ng-model="currentOrder.autoID" />
            <span>{{('Auto' | r) + ' ' + ('ID' | r) | xlat}}</span>
          </label>
        </div>
      </div>

      <!--
        The support notice used to sit here. It has moved to the foot of the page
        (`checkOutView.html`), because it is help rather than a step: for an ordinary
        shopper it was the ONLY thing in this section, so the checkout opened with a
        heading reading "Order" above a box of text with nothing to do in it.
      -->

      <div class="hz-co-field"
           ng-show="user.Permissions.contains('CostCenterPerOrder') && !user.Permissions.contains('CostCenterPerLine') && user.CostCenters.length > 0 || user.Permissions.contains('CostCenterPerOrder') && user.Permissions.contains('FreeFormCostCenter')">
        <label class="hz-co-label is-required" for="hz-co-costcenter">
          {{'Cost Center' | r | xlat}}
        </label>
        <select id="hz-co-costcenter" class="hz-co-select"
                ng-required="user.Permissions.contains('CostCenterPerOrder') && !user.Permissions.contains('CostCenterPerLine') && !user.Permissions.contains('FreeFormCostCenter')"
                ng-change="updateCostCenter()"
                ng-if="user.CostCenters.length > 1 && !user.Permissions.contains('FreeFormCostCenter')"
                ng-options="center.Name as center.Name for center in user.CostCenters"
                ng-model="currentOrder.CostCenter">
          <option value=""></option>
        </select>
        <input class="hz-co-input" type="text"
               ng-show="user.Permissions.contains('FreeFormCostCenter')"
               ng-model="currentOrder.CostCenter"
               ng-required="user.Permissions.contains('CostCenterPerOrder') && !user.Permissions.contains('CostCenterPerLine') && user.Permissions.contains('FreeFormCostCenter')"
               placeholder="{{'Cost Center' | r | xlat}}" />
        <p class="hz-co-static"
           ng-if="user.CostCenters.length == 1 && !user.Permissions.contains('FreeFormCostCenter')">
          {{currentOrder.CostCenter}}
        </p>
      </div>

      <!--
        Champion ordering on behalf. The two checkboxes are mutually exclusive and each is
        `ng-required` unless the other is ticked, so one reason is always given — that
        pairing is what the Hertz approval team reads, and it is unchanged.
      -->
      <div class="hz-co-sub"
           ng-if="hertzChampionUser || dollarChampionUser || thriftyChampionUser"
           ng-init="championReturnExchange = championReturnExchange || !!(((currentOrder.OrderFields | filter:{Name:'CG_IntegrationField2'})[0] || {}).Value); championOtherReason = championOtherReason || !!(((currentOrder.OrderFields | filter:{Name:'CG_IntegrationField5'})[0] || {}).Value)">
        <!--
          Whose order this is, from the cart itself (one employee per cart). The Employee
          Number field below is filled with their id by CheckOutViewCtrl, which is what the
          Hertz approval team reads, so the Champion no longer types it. The field is shown
          only when the cart could not be matched to anyone, as the way to say who it is for.
        -->
        <div class="hz-co-ship-card hz-co-behalf" ng-if="onBehalfOf">
          <svg class="hz-co-ship-pin" viewBox="0 0 24 24" width="22" height="22" fill="none"
               stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
            <circle cx="12" cy="8" r="3.6"></circle><path d="M4.5 20a7.5 7.5 0 0 1 15 0"></path>
          </svg>
          <div class="hz-co-ship-body">
            <p class="hz-co-ship-h">Ordering on behalf of</p>
            <p class="hz-co-behalf-name">{{onBehalfOf.name}}</p>
            <p class="hz-co-behalf-id">Employee ID {{onBehalfOf.employeeId}}</p>
          </div>
        </div>

        <div class="hz-co-field" ng-show="!onBehalfOf"
             ng-repeat="field in currentOrder.OrderFields | filter:{Name:'CG_IntegrationField1'}">
          <octextfield customfield="field" options="options" ng-if="field.ControlType == 'Text'"
                       ng-required="true" label="Employee Number"></octextfield>
        </div>

        <!--
          "Why are you placing this order?" is switched off (Trevor, 24 Sep 2026). The two
          checkboxes were required, so while they were on the page they held Submit back.
          To bring it back, remove this comment's opening and closing lines.

        <p class="hz-co-sub-q">Why are you placing this order?</p>

        <div class="hz-co-choices">
          <label class="hz-co-choice">
            <input type="checkbox" name="champion_return_exchange"
                   ng-model="championReturnExchange"
                   ng-change="championReturnExchange && (championOtherReason = false)"
                   ng-required="!championOtherReason" />
            <span class="hz-co-choice-t">
              <strong>Is this for a return or exchange?</strong>
              Provide the RMA number from the return form.
            </span>
          </label>
          <label class="hz-co-choice">
            <input type="checkbox" name="champion_other_reason"
                   ng-model="championOtherReason"
                   ng-change="championOtherReason && (championReturnExchange = false)"
                   ng-required="!championReturnExchange" />
            <span class="hz-co-choice-t">
              <strong>Is this for another reason?</strong>
              Explain why the order is being placed for this individual.
            </span>
          </label>
        </div>

        <div ng-repeat="field in currentOrder.OrderFields | filter:{Name:'CG_IntegrationField2'}">
          <div class="hz-co-field" ng-if="championReturnExchange || field.Value">
            <octextfield customfield="field" options="options" ng-if="field.ControlType == 'Text'"
                         ng-required="championReturnExchange"
                         label="RMA number from the return or exchange form"></octextfield>
          </div>
        </div>

        <div ng-repeat="field in currentOrder.OrderFields | filter:{Name:'CG_IntegrationField5'}">
          <div class="hz-co-field" ng-if="championOtherReason || field.Value">
            <octextfield customfield="field" options="options" ng-if="field.ControlType == 'Text'"
                         ng-required="championOtherReason"
                         label="Why this order is being placed for this employee"></octextfield>
          </div>
        </div>
        -->
      </div>

    </form>
  </div>
</div>
