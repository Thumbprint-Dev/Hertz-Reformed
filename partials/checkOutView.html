<!--
  Checkout.

  A two-column shell: the steps on the left, the summary beside them. The three step cards
  are `orderdetails`, `ordershipping` and `orderbilling`, which are the stock theme's form
  partials and are left alone — they are where address, payment and approval behaviour
  lives, and rewriting them is a separate job from making this page read properly.

  Every custom element carries an explicit closing tag.
-->
<section class="hz-co">
  <loadingindicator ng-show="displayLoadingIndicator"
                    title="{{'Please wait while we update your order' | r | xlat}}"></loadingindicator>

  <div class="hz-co-head">
    <h1 class="hz-co-title">Checkout</h1>
    <a class="hz-co-back" href="cart">&larr; Back to cart</a>
  </div>

  <div class="hz-co-grid">
    <div class="hz-co-main" ng-show="currentOrder && currentOrder.isEditable">
      <!--
        One panel, not three cards.

        Order, shipping and billing are steps in a single act, and the employee is not
        choosing between them — they fill the form top to bottom and submit. Three bordered
        cards said "three things to do" and made a short form look like an application.
        They are now sections of one surface, separated by a rule and their own heading,
        which is the shape a checkout is expected to have.

        The directives are untouched: `orderdetails`, `ordershipping`, `orderbilling` and
        `orderapprovals` each still render their own form, keep their own `name` for
        validation, and are hidden by their own conditions — billing does not render at all
        for an order with nothing to charge, and the panel simply closes up around it.

        Messages stay outside the panel, because an error about the order is not a section
        of the order.
      -->
      <div class="hz-co-panel">
        <orderdetails></orderdetails>
        <ordershipping></ordershipping>
        <orderbilling></orderbilling>
        <orderapprovals ng-show="currentOrder.Approvals"></orderapprovals>
      </div>

      <div class="hz-co-alert" ng-show="errorMessage"><p>{{errorMessage}}</p></div>
      <div class="hz-co-said" ng-show="actionMessage"><p>{{actionMessage}}</p></div>

      <!--
        Where to get help, at the foot of the page.

        It was the body of the "Order" step, which for an ordinary shopper meant checkout
        opened on a heading with nothing under it but this. It is not a step and nothing
        waits on it, so it belongs after the form rather than in front of it. The champion
        carve-out is kept verbatim: an employee is told to ask their Uniform Champion, and a
        Champion is not told to ask themselves.
      -->
      <div class="hz-co-help">
        <p ng-hide="hertzChampionUser || dollarChampionUser || thriftyChampionUser">
          Questions about your uniform? Speak to your Uniform Champion.
        </p>
        <p>
          Trouble checking out? Use the Chat button while signed in, or email
          <a href="mailto:hertzsupport@thumbprint.com">hertzsupport@thumbprint.com</a>.
        </p>
      </div>
    </div>

    <aside class="hz-co-side" aria-label="Order summary">
      <ordersummary></ordersummary>
    </aside>
  </div>
</section>
