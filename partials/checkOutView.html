<!--
  Checkout.

  A two-column shell: the steps on the left, the summary beside them. The three step cards
  are `orderdetails`, `ordershipping` and `orderbilling`, which are the stock theme's form
  partials and are left alone — they are where address, payment and approval behaviour
  lives, and rewriting them is a separate job from making this page read properly.

  Every custom element carries an explicit closing tag.
-->
<section class="hz-co">
  <loadingindicator ng-show="displayLoadingIndicator"
                    title="{{'Please wait while we update your order' | r | xlat}}"></loadingindicator>

  <div class="hz-co-head">
    <h1 class="hz-co-title">Checkout</h1>
    <a class="hz-co-back" href="cart">&larr; Back to cart</a>
  </div>

  <div class="hz-co-grid">
    <div class="hz-co-main" ng-show="currentOrder && currentOrder.isEditable">
      <orderdetails></orderdetails>
      <ordershipping></ordershipping>
      <orderbilling></orderbilling>
      <orderapprovals ng-show="currentOrder.Approvals"></orderapprovals>

      <div class="hz-co-alert" ng-show="errorMessage"><p>{{errorMessage}}</p></div>
      <div class="hz-co-said" ng-show="actionMessage"><p>{{actionMessage}}</p></div>
    </div>

    <aside class="hz-co-side" aria-label="Order summary">
      <ordersummary></ordersummary>
    </aside>
  </div>
</section>
