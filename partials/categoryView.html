    .marketing-title {

    .marketing-text {

    }
  
    .marketing-li {
      text-align: center;
      padding: 20px;
    }
  
    .marketing-image-title {
      min-height: 250px;
    }
  
    .box {
      display: flex;
      justify-content: center;
      width: 100%;
      max-width: 1000px;
      border: 1px solid rgb(220, 68, 5);
      border-radius: 5px;
      overflow: hidden;
      /* Ensures the border-radius applies to children */
    }
  
    .image-half,
    .content-half {
      width: 50%;
      /* Ensures both divs take up 50% of the container's width */
      display: flex;
      justify-content: center;
      align-items: center;
    }
  
    .image-half img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      /* Ensures the image covers the full half without distortion */
    }
  
    .content-half {
      background-color: rgb(220, 68, 5);
      color: white;
      flex-direction: column;
      padding-left: 50px;
      align-items: flex-start;
    }
  
    .content-half p {
      margin: 5px 0;
      font-size: 1.5em;
      font-weight: bold;
    }
  
    .shop-men-btn {
      background-color: white;
      color: rgb(220, 68, 5);
      border: 2px solid white;
      padding: 10px 20px;
      font-size: 1.2em;
      cursor: pointer;
      border-radius: 5px;
      transition: background-color 0.3s, color 0.3s;
      margin-top: 10px;
    }
  
    .shop-men-btn:hover {
      background-color: #f0f0f0;
      border: 2px solid #f0f0f0;
    }
  
    /* Media Query for Mobile Devices */
    @media screen and (max-width: 768px) {
      .box {
        flex-direction: column;
        /* Stacks the image and content vertically on small screens */
        max-width: 100%;
        /* Ensure it takes full width on mobile */
        border: none;
      }
  
      .image-half,
      .content-half {
        /* Ensure each half takes full width when stacked */
        padding: 20px;
        /* Add some padding for a better mobile view */
        border-radius: 0px;
      }
  
      .content-half {
        padding-left: 0;
        /* Remove the left padding on mobile */
        align-items: center;
        /* Center the content */
        text-align: center;
        /* Center the text */
      }
  
      .content-half p {
        font-size: 1.2em;
        /* Reduce font size for mobile */
      }
  
      .shop-men-btn {
        font-size: 1em;
        /* Reduce button font size for mobile */
        padding: 8px 16px;
        /* Adjust padding for the button */
      }
    }
  
    @media screen and (max-width: 991px) {
      .marketing-text {
        text-align: center;
        float: none;
      }
    }
  </style>
