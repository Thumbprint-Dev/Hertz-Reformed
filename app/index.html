<section class="main-wrapper">
    <section ng-hide="Four51User.isAuthenticated() || (isAnon && Four51User.isAuthenticated())" class="container">
        <login />
    </section>
    <section ng-if="Four51User.isAuthenticated()" id="content" style="background-color:white;">
        <section class="hidden-print">
            <headernavigation />
        </section>
        <!--<section class="hidden-print hidden-xs hidden-sm">
            <navigation />
        </section>-->
        <section class="hidden-print">
            <hamburgernavigation />
        </section>
        <section class="hiiden-print" style="">
            <branding class="" />
        </section>
        <section class="mainContainer" ng-class="{'container-view':(isInPath('product') || isInPath('checkout'))}">
            <ng-view autoscroll />
        </section>
        <section class="hidden-print">
            <copyright ng-if="!user.Permissions.contains('UnBrandedSite')" />
        </section>
