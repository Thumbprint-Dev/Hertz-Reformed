<!--
  The two faces the theme actually asks for, which were never loaded.

  `custom.css` sets `'Open Sans', Arial` as the body face and
  `'Barlow Semi Condensed', 'Arial Narrow'` as `--display`, and the only webfont on the
  page was Signika, which nothing uses. So every page was rendering Arial, and every
  heading and numeral was rendering **Arial Narrow** — a genuinely narrow face, which is
  why the type looked stretched.

  It showed worst on the allocation picker, which is the page that leans on the display
  face hardest: the title, the remaining count on each of six pools, the rail total and
  every SKU. Other pages spend it on a title alone, so the same substitution was easier
  to miss there.

  Weights are the ones the stylesheet uses: 400, 600 and 700 for Open Sans, 600 and 700
  for the display face. `display=swap` so text paints in the fallback and is re-rendered
  rather than being invisible while the font arrives.

  Signika is kept because it costs nothing to leave and removing an unused font from a
  theme file is not what this change is for.
-->
<link href="https://fonts.googleapis.com/css2?family=Barlow+Semi+Condensed:wght@600;700&family=Open+Sans:wght@400;600;700&family=Signika:wght@300..700&display=swap" rel="stylesheet">
